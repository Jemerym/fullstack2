<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <!-- Fuente moderna de Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <title>ElVolcan - Iniciar Sesión</title>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon"></div>
            <h1>El <span>Volcan</span></h1>
            <p>Acceso al sistema de distribución</p>
        </div>

        <form class="login-form" onsubmit="event.preventDefault(); ingresar();">
            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="usuario@demo.cl" required>
            </div>

            <div class="input-group">
                <label for="clave">Contraseña (4 dígitos)</label>
                <input type="password" id="clave" maxlength="4" placeholder="••••" required>
            </div>
            <button type="submit">Ingresar al Sistema</button>
        </form>

        <footer>
            <p>&copy; 2026 GasExpress. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
